[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crc24-interlaken"
version = "0.1.0"
description = "Pure-Python CRC-24/Interlaken reference implementation, zero deps"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
bench = ["crcmod"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
crc24-interlaken = "crc24_interlaken.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
